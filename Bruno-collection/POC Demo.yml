      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: WeatherForecast
      type: http
      seq: 9
    http:
      method: GET
      url: '{{url}}/weatherforecast'
      auth:
        type: basic
        username: admin
        password: password
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: 'POST Regions '
      type: http
      seq: 3
    http:
      method: POST
      url: '{{url}}/api/region/regions'
      body:
        type: json
        data: |-
          {
            "Id": "1",
            "Name": "Deepak",
            "Code": "DPK"
          }
      auth:
        type: bearer
        token: '{{access_token}}'
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Auth Token
      type: http
      seq: 4
    http:
      method: POST
      url: '{{url}}/api/Auth/token'
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "username": "admin",
            "password": "password"
          }
      auth: inherit
    runtime:
      scripts:
        - type: after-response
          code: |-
            const body = res.getBody();

            console.log("Response body:", body);

            bru.setEnvVar("access_token", body.accessToken);

